<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Story - Dark Edition</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Great+Vibes&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Comfortaa', 'sans-serif'],
                        serif: ['Lora', 'serif'],
                        script: ['Great Vibes', 'cursive'],
                    },
                    colors: {
                        love: { light: '#fda4af', base: '#e11d48', deep: '#881337', gold: '#fbbf24', cream: '#fdfbf7' },
                        paper: { dark: '#1c1917', darker: '#0c0a09' }
                    }
                }
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>

    <style>
        /* === CUSTOM DARK SCROLLBAR === */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.1); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #44403c; border-radius: 10px; }
        .custom-scrollbar { scrollbar-width: thin; scrollbar-color: #44403c transparent; }
        strong{
            font-weight: bolder;
        }
        .book-stage { background: radial-gradient(circle at center, #292524 0%, #000000 100%); }
        .my-page {
            background-color: #1c1917;
            border-top: 1px solid #44403c; border-bottom: 1px solid #44403c;
            color: #e7e5e4; overflow: hidden;
        }
        .my-page.--hard {
            background-color: #4a041d; border: 4px solid #b45309; color: #fbbf24;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%23000000' fill-opacity='0.2' fill-rule='evenodd'/%3E%3C/svg%3E");
        }
        .my-page.--simple { box-shadow: inset 0 0 40px rgba(0,0,0,0.6); }
        
        /* Blinking Cursor for Typing Effect */
        .typing-cursor::after {
            content: '|';
            animation: blink 1s step-end infinite;
            color: #fbbf24;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body class="h-dvh w-screen overflow-hidden bg-stone-950">

    <div id="mobile-warning" class="fixed inset-0 z-[100] bg-stone-950 flex flex-col items-center justify-center p-10 text-center lg:hidden">
        <div class="text-6xl mb-6 animate-bounce">💻</div>
        <h2 class="text-2xl font-serif text-love-gold mb-4">A Cinematic Experience Awaits</h2>
        <p class="text-stone-400 max-w-sm leading-relaxed font-sans">
            Our story is best told on a larger canvas. Please open this link on a <strong>Desktop or Laptop</strong> to begin the journey.
        </p>
        <div class="mt-8 text-love-base/30 text-4xl">♥</div>
    </div>

    <div id="cinematic-overlay" class="hidden lg:flex fixed inset-0 z-50 bg-stone-950 flex-col items-center justify-center text-white transition-opacity duration-1000">
        <div id="start-screen" class="text-center space-y-8 animate-pulse">
            <div class="text-9xl text-love-base drop-shadow-[0_0_15px_rgba(225,29,72,0.5)]">♥</div>
            <button id="begin-btn" onclick="enterFullscreen()" class="px-8 py-3 border border-rose-800 text-rose-200 rounded-full hover:bg-love-base hover:text-white hover:border-transparent transition-all">
                Start the Love
            </button>
        </div>
        <div id="title-sequence" class="hidden text-center">
            <h1 id="movie-title-text" class="text-7xl font-script text-love-gold drop-shadow-lg styping-cursor"></h1>
        </div>
    </div>

    <main id="reader-app" class="hidden lg:flex opacity-0 transition-opacity duration-1000 h-dvh w-full flex-col book-stage">
        <header class="h-14 flex items-center justify-between px-6 z-20 bg-stone-900/50 backdrop-blur-md border-b border-stone-800">
            <span class="font-script text-2xl text-love-gold">Our Story</span>
            <div class="flex items-center gap-4">
                 <button onclick="toggleFullscreen()" class="text-stone-400 hover:text-white text-sm uppercase tracking-widest">⛶ Fullscreen</button>
                <button id="music-toggle-btn" class="w-8 h-8 rounded-full bg-stone-800 text-love-gold border border-stone-700 shadow opacity-50">🎵</button>
            </div>
        </header>

        <div class="flex-1 flex items-center justify-center py-4">
            <div id="book" class="relative drop-shadow-[0_20px_40px_rgba(0,0,0,0.9)]"></div>
        </div>

        <footer class="flex items-center justify-center gap-8 pb-8 z-20">
            <button id="prev-btn" class="px-6 py-2 bg-stone-800 border border-stone-700 rounded-full shadow text-stone-300 hover:text-love-gold hover:border-love-gold transition-all">Previous</button>
            <button id="next-btn" class="px-6 py-2 bg-love-deep border border-love-base text-love-cream rounded-full shadow hover:bg-love-base transition-all">Next Page</button>
        </footer>
    </main>

    <audio id="bg-music" loop></audio>
    <audio id="title-music"></audio>

    <script>
        function enterFullscreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) { /* Safari */
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { /* IE11 */
                elem.msRequestFullscreen();
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                enterFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>
    <script src="app.js"></script>
</body>
</html>
